# Основные настройки «Фокус-пруда».
# Изменения из раздела «Настройки» в интерфейсе хранятся в базе и
# накладываются поверх этого файла.

server:
  port: 8765

# normal — обычная работа; dev — видна панель разработчика;
# demo — ускоренное время (demo_speed) + панель разработчика.
mode: normal
demo_speed: 30

thresholds:
  phone_grace_s: 30            # телефон можно достать на 30 с без последствий
  distraction_confirm_s: 30    # сколько секунд в категории distraction до DISTRACTED
  neutral_limit_s: 90          # сколько секунд в neutral до MAYBE_DISTRACTED
  idle_limit_s: 180            # простой без ввода до MAYBE_DISTRACTED (не в режиме тетради)
  maybe_to_distracted_s: 180   # сколько длится MAYBE до DISTRACTED
  recover_s: 5                 # сколько секунд «хороших» сигналов нужно, чтобы вернуться в FOCUS
  notebook_max_min: 45         # максимум режима тетради подряд, затем вопрос «ты ещё тут?»
  notebook_answer_s: 120       # сколько ждём ответа на «ты ещё тут?»

session:
  auto_start_on_dock: true
  default_length_min: 25
  demo_length_min: 120         # длина сессии в демо (при ×30 это 4 минуты)
  auto_end_after_phone_out_min: 10
  break_min: 5

# Pomodoro для длинных сессий: work_min работы, short_break_min отдыха; после cycles рабочих
# отрезков перерыв длинный (long_break_min). Во время перерыва блокировка выключена и рыбки не
# растут, после него защита включается сама. Время перерывов в длину сессии не входит.
pomodoro:
  enabled: true
  min_session_min: 50          # сессии короче идут без перерывов
  work_min: 25
  short_break_min: 5
  cycles: 4
  long_break_min: 25           # 20–30 минут

# Связь с Android-телефоном по Wi-Fi (без облака). По умолчанию выключена: пока
# lan_enabled: false, программа слушает только этот компьютер (127.0.0.1).
# Если включить, для телефона открывается ОТДЕЛЬНЫЙ порт в домашней сети; он
# принимает только сопряжение по QR-коду и подключения с токеном.
network:
  lan_enabled: false
  port: 8766

# Защита от отвлечений. strictness: soft — только предупреждение, hard — блокировка.
# targets: pc — только компьютер, phone — только телефон, both — оба.
# list_mode: blacklist — нельзя только отвлекающее (правила в rules.yaml);
#            whitelist — во время учёбы можно только allow_apps и allow_sites,
#            остальное блокируется. Пустой белый список ничего не блокирует.
protection:
  strictness: soft
  targets: pc
  list_mode: blacklist
  allow_apps: []
  allow_sites: []
  warn_s: 10              # сколько секунд на сохранение работы до закрытия программы (жёстко)

# Куда вести кнопку «Написать отзыв» в настройках (ссылка на форму, чат или mailto:адрес).
# Пусто — кнопка подсказывает, что отправить архив с отчётом можно вручную.
app:
  feedback_url: ""

ui:
  theme: system              # оформление: light, dark или system (как в системе)

sound:
  enabled: true
  distracted_repeat_s: 180     # звук «отвлёкся» не чаще раза в 3 минуты
  min_gap_s: 5                 # любые два звука — не чаще, чем раз в 5 секунд
  # Звуки-«возвращалки»: пока длится отвлечение (DISTRACTED), каждый следующий уровень настойчивее.
  # Играют системным звуком компьютера, даже если вкладка закрыта. Время — как в игре (в демо ускоряется).
  nudge:
    enabled: true
    after_s: [60, 180, 360, 600]   # через сколько секунд отвлечения звучит уровень 1, 2, 3, 4
    repeat_s: 120                  # после последнего уровня повторять его так часто
    volume: 0.6                    # 0.05–1.0

device:
  serial_port: ""              # "" — подставки ESP32 нет
  phone_source: auto           # auto — любой способ; usb — кабель; serial — подставка; mock — вручную
  usb_phone: {id: "", name: ""}  # телефон, привязанный по USB (заполняется мастером привязки)
