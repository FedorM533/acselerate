<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сайт закрыт на время учёбы</title>
  <style>
    :root { --bg: #eaf6fb; --card: #ffffff; --text: #17324a; --muted: #5b7388; --accent: #1f7aa8; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f2433; --card: #17324a; --text: #e6f2f9; --muted: #9db7c9; --accent: #5cc0ea; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: var(--bg); color: var(--text); font: 18px/1.5 system-ui, "Segoe UI", sans-serif; }
    main { max-width: 460px; text-align: center; background: var(--card); padding: 32px 24px;
           border-radius: 20px; box-shadow: 0 8px 30px rgba(0, 0, 0, .12); }
    .fish { font-size: 56px; }
    h1 { font-size: 24px; margin: 8px 0; }
    p { margin: 8px 0; color: var(--muted); }
    b { color: var(--text); }
    button { margin-top: 16px; padding: 12px 24px; font: inherit; border: 0; border-radius: 12px;
             background: var(--accent); color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div class="fish">🐟</div>
    <h1>Сейчас время учёбы</h1>
    <p><b id="site">Этот сайт</b> закрыт, пока идёт сессия.</p>
    <p id="left"></p>
    <button id="close">Закрыть вкладку</button>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
